# ============================================================
# 工厂老化测试工具 - 配置文件
# 设备: 全志 A527 (ARM Cortex-A55 + Mali-G57)
# ============================================================

# 服务监听
server:
  host: "0.0.0.0"
  port: 8000

# 服务生命周期 (关浏览器 → 服务自动退)
# ⚠️ 正在跑测试时**永远不会**因为空闲而退出, 这条只在没有任何测试在跑时生效。
service:
  idle_exit_sec: 600          # 页面静默多久后自动退出 (10 分钟)
  goodbye_grace_sec: 30       # 页面主动告别 (sendBeacon) 后的宽限
  never_connected_exit_sec: 3600  # 起了服务但一直没人访问时的存活上限
  # 「关闭服务」默认只接受本机 (127.x) 的调用 —— 服务绑在 0.0.0.0, 不设防的话
  # 同网段任何人都能把服务点掉。产线要用平板远程关, 才把这里改成 true。
  allow_remote_shutdown: false

# 测试流程中的「等待」 (§7.3)
flow:
  # 卡槽空 / 网线没插时, 整轮**真的停住**等工人选「已插好重测」或「跳过」。
  # 为什么必须停: 后端不停的话, 工人还在弹框前犹豫, 后面几项已经跑完了,
  # 屏幕停在 USB 上而日志在写 HDMI, 报告自然对不上。
  #
  # 超时后自动往下走 —— 没人操作时不能把整轮挂死 (工人去拿卡了、
  # 页面被他关掉了)。这个值要大于「工人跑去拿卡再插上」的合理时间。
  #
  # ⚠️ 别配 1 以下的小数 —— 曾经这里写的是 int(), 0.5 会被截成 0,
  #    于是「等操作员」瞬间失效, 症状和没写这个功能一模一样。
  operator_wait_sec: 300

# 网络接口 (根据实际设备改)
interfaces:
  wifi: "wlan0"

# 网口测试配置 (§6.6)
# 链路 + DHCP + 出网, **不做吞吐** —— 吞吐不在老化测试范围
eth:
  iface: "eth0"                # 网口设备名
  # ── 第 ③ 步出网: 三级降级, 任一级通过即算通过 ──
  ping_gateway: "auto"         # 优先级 1: "auto" = 从 `ip route` 自动取默认网关
  ping_dns: "223.5.5.5"        # 优先级 2: DNS 服务器
  ping_target: "www.baidu.com" # 优先级 3: 公网域名
  ping_count: 6                # 每级 ping 包数
  ping_timeout_sec: 2          # 单包超时
  # ── 第 ② 步取 IP ──
  dhcp_timeout_sec: 10         # DHCP 取 IP 超时, 超时转静态兜底
  static_ip: "192.168.1.50/24" # DHCP 失败时的静态兜底地址

# 风扇 GPIO (B 类纯 GPIO 通断, 无 tach 反馈)
# PI5 = 40-pin 物理针脚 5, 厂家内核镜像把它暴露成 0666 的直通文件。
# §6.8: 该节点由出货镜像提供, apt 包补不了 —— 缺失判 error, 不静默回退。
#
# ✅ **读写双向可用** (2026-10-22 实测): 终端 `echo 0/1 > /proc/rp_gpio/pi5`
#    能正常启停风扇; Python 侧用 `os.open`+`os.write` 写、`os.open`+`os.read` 读,
#    每次写完回读校验, 四次往返全部一致, 电平可还原。
#
# ⚠️ **必须用裸系统调用** (`os.open`/`os.read`/`os.write`), 不能用 Python 的
#    `open(p,'rb')` —— 缓冲读会 kernel panic。实测表见 server/tests/fan.py 顶部。
fan:
  procfs_path: "/proc/rp_gpio/pi5"   # 厂家脚位暴露路径
  drive: true                  # true = 主动拉低/拉高轮转 (风扇会真的启停);
                               # false = 只读体检, 只测「节点能不能稳定读出电平」
  active_level: "high"         # "high" = 1 是风扇运行; "low" = 0 是运行
  cycles: 2                    # 轮转轮数 (drive=true) / 连读采样次数 (drive=false)
  sample_gap_sec: 0.3          # 只读模式下两次采样之间的间隔
  drive_settle_sec: 5.0        # 写完电平到回读之间的等待。这 5 秒里同步发生三件事:
                               #   ① 电平稳定 ~10ms  ② 风扇物理启转 ~0.5-1.5s
                               #   ③ 操作员目视确认启停 ~2s
                               # 设太小的话风扇刚起步就回读了, 工人来不及看 ——
                               # 而「看见风扇转起来」正是确认虚焊/不转的唯一手段。
                               # 产线 5.0s, 返修可调到 8.0s。

# 测试默认参数 (UI 上可改)
defaults:
  cpu:
    enabled: true
    times: 1
    # 默认只是**出厂基线**, 产线嫌短自己在页面上调大即可。
    # 300s → 180s → 120s → 60s: 温度一分钟内就爬到平台, 再长只是白等。
    duration_sec: 60
    threads: 0              # 0 = 全部核
    max_temp_c: 85
  gpu:
    # §6.3: 默认 1 轮 = 原单轮行为, 出货判定口径不变; 可手动调大加强覆盖。
    enabled: true
    rounds: 1                # 跑几轮 glmark2; 多轮 = 多次独立启动, 还能看出分数衰减趋势
    # **每个场景渲染多久** (秒) —— §6.3 方案A。
    # 场景集**一个不少** (33 个, 见 server/tests/gpu_benchmarks.py), 只把每个
    # 场景的时长从 glmark2 默认的 10s 压到 3s → 一轮 33×3 ≈ 99 秒 + 装载开销
    # = 实测 105.2 秒 (1 分 45 秒)。
    # ⚠️ 分数会随这个值变: 10s (glmark2 默认) 时全屏基线约 148, 3s 时见
    #    docs/需求设计.md §6.3 的新基线 —— **两者的分数不能横向比**。
    #    想要跟历史数据同口径就填 10 (一轮要 5 分半)。
    scene_sec: 3
    # 单轮超时上限 (**非**整项上限), 超时即 error。
    # 比一轮的预计时长 (33×3=99s, 实测 105.2s) 宽裕一截 —— 这是防「GPU 挂死跑飞」的兜底,
    # 不是「本项要跑多久」; 实际时长由上面的 scene_sec 决定。
    timeout_sec: 240
    # glmark2 变体选择 (§6.3): "auto" = 按当前图形会话自动挑
    #   有 WAYLAND_DISPLAY → glmark2-es2-wayland, 前置查 WAYLAND_DISPLAY
    #   有 DISPLAY         → glmark2-es2,         前置查 DISPLAY
    # 可强制 "wayland" / "x11"。**别改这个去绕过问题** —— auto 选不出变体
    # 说明会话环境不对, 报 error 比硬跑一个连不上的二进制安全。
    # 2026-10-22: 原文写死"用 glmark2-es2 + 必须有 Wayland", 而 glmark2-es2
    # 实际是 X11 变体(ldd 链 libX11), 两者互斥 —— 本机 x11 会话下 GPU 项
    # 在 GPU 完全正常时被自己的前置条件挡死(run 41/48)。故改为自动适配。
    variant: auto
  wifi:
    # §6.4: 每轮是 4 步流程 (开关→状态→射频→扫描), 单轮时长由各步超时决定,
    # 所以**只给 [次数]、不给 [时长]**。默认 1 = 出货口径不变; 老化加强时
    # 调大, 反复开关射频 + 反复扫描更容易暴露间歇性驱动问题。
    enabled: true
    times: 1
    iface: "wlan0"               # 接口名 (默认 wlan0, 留空则自动探测 wlp*/wlx*)
    switch_settle_sec: 1.0       # ① down 与 up 之间的间隔 (**不含**等 up 生效的时间,
                               #     那是下面 state_timeout_sec 的事)
    # ② set up 之后轮询 `ip link show` 直到 state=UP 的上限。
    # **必须轮询, 不能固定 sleep**: 无线驱动 set up 后还要初始化射频, 这段
    # 时间内核报 state DORMANT (接口已 up, 链路未就绪), 属正常中间态。
    # 2026-10-22 本机实测 DORMANT→UP 要 3.22 秒, 而原先固定等 1.0s 就去读 ——
    # run 43/44/47 三次全倒在这。改成轮询后驱动初始化多慢都能过, 真超时才 fail,
    # 且报错能区分「没等到」(超时) 和「等到了但状态不对」。
    # 驱动就绪耗时记进 metrics.state_wait_ms, 老化时可看出初始化有没有变慢。
    state_timeout_sec: 10.0
    scan_timeout_sec: 15         # ④ 单次 iw scan 超时
    scan_retry_count: 2          # ④ 4b 额外重试次数 (共最多 3 次)
    scan_retry_gap_sec: 5        # ④ 4b 重试间隔
  usb:
    enabled: true
    # 3 轮 × 18s = **54s**。18×N 到不了整 60 —— 要正好一分钟得用 20s×3
    # 或 15s×4, 按产线节拍二选一改这里即可。
    times: 3
    # 每轮**持续写入**多少秒 (靠 fio --time_based + --runtime)。
    # 以前这里只写死 32MB 跑一遍就完, UI 上标的「写 30s / 读 30s」是假的。
    # ⚠️ 这一项写的是 `/dev/sdX` 裸块设备, 会真的反复擦写 U 盘 ——
    #    别拿唯一一份、有未备份数据的盘来跑。
    duration_sec: 18
    size_mb: 32
    # 📌 2026-10-23 删除 `min_write_mbps`。**速度不再决定通过与否** —— 同型号 U 盘
    #    写入个体差异极大, 且 USB 2.0 High-Speed 链路上闪存写入典型值只有 8~20 MB/s
    #    (要走 FTL 擦写, 普遍比读慢一半)。原来 20 的阈值卡在典型值上沿, 实测一个
    #    正常 U 盘三轮稳定 10.7~10.9 MB/s 就被判 failed。现在**只有 fio 退出码判定**:
    #    读写出错、盘报错才算失败; 速度仍作为 `round_N_write_mbps` / `avg_write_mbps`
    #    上报, 供产线看趋势、排查慢盘。
  ethernet:
    # §6.6: 每轮是 3 步流程 (链路→DHCP→出网), 单轮时长由各步超时决定,
    # 所以**只给 [次数]、不给 [时长]**。默认 1 = 出货口径不变; 老化加强
    # 时调大, 反复建链 / 反复续 DHCP 更容易暴露间歇性 PHY 和网络栈问题。
    enabled: true
    times: 1
  hdmi:
    enabled: true
    target_resolution: "1920x1080@60"
  fan:
    # 默认开启。**读写双向**: 主动把电平拉低/拉高若干轮, 每步都回读校验,
    # 写什么读回什么才判通过 —— 这样「虚焊 / 接触不良 / 风扇压根不转」这条
    # 才算真覆盖到了, 而不是只测「节点能不能读」。
    #
    # 跑完 (无论通过/失败/取消/异常) 都会在 finally 里把电平还原成起始值,
    # 不会把设备留在「风扇停止」状态。
    #
    # 轮转期间风扇会真的启停 —— 产线上要确认机箱内无异物。
    # 想保守一点只做只读体检: 改上面的 `fan.drive: false`。
    enabled: true
    cycles: 2
  tfcard:
    enabled: true
    # ⚠️ **没有 `inserted` 这个键** —— 2026-10-26 查实: 全仓库没有一处读它
    #    (前端也没有这个勾选框, UI 上的提示写的是「运行时自动检测 · 未插弹提示」)。
    #    以前这里写着 `inserted: false # UI 上勾选才执行`, 是**一句假话** ——
    #    而且它把 docs/需求设计.md §3.1 的整轮时长算多了 60s (以为 TF 一定会跑
    #    写30+读30), 实际卡槽空时该项 0.0s 判 skipped, 只会弹框等工人(§7.3)。
    #    实际行为: 开了 `enabled` 就**总会执行**该项 → 自动探挂载点 →
    #    探到卡就跑写30s+读30s; 探不到就 skipped + 弹框让工人插卡或跳过。
    #    不想跑就关掉上面的 `enabled` (配置页上也有这一项的勾选)。
    # ⚠️ **duration_sec 是「每个阶段」的时长** —— 写一遍 duration 秒 + 读一遍
    #    duration 秒, 所以本项总耗时 = duration_sec × 2 = 60s。
    #    配置页那个「时长」框填的是单阶段值, 别看到 30 就以为只跑 30 秒。
    duration_sec: 30
    min_read_mbps: 10
    # 轮数 = 写+读整套跑几遍 (代码读这个键)
    times: 1
    # 工作集大小 (MB) = 每次写多大的测试文件 (代码读这个键)
    size_mb: 64
  memory:
    enabled: true
    # **次数 = memtester 跑几遍**, 这是 memtester 原生接口 `memtester <量> <遍数>`
    # 真正的旋钮, 也是配置页上给工人调的参数。老化要加强就调大它。
    # 界面上的进度条**就是按它走的**: 第 i/N 轮 → i/N 完成(§7.5)。
    times: 1
    # ⚠️ **这是超时上限, 不是「本项要跑多久」**。键名刻意不叫 `duration_sec`:
    #    那个键会被 §7.2 渲染成「时长」输入框, 让工人以为调它就能控制运行时长,
    #    实际调了没用。
    #    ⚠️ 但在生产配置(size_mb=1024)下**每一轮都会碰到这个上限** ——
    #    memtester 跑不完它的 18 项, 每次都被掐断(rc=124), 实测一轮 60.4s
    #    (换 64MB 工作集也是这个数: 耗时由 memtester 固定的迭代次数主导)。
    #    进度条按「一轮约一分钟」推进, 跑完一轮就用那一轮的实测时长校准下一轮。
    timeout_sec: 60
    size_mb: 1024
  emmc:
    enabled: true
    times: 1
    # ⚠️ 同 TF 卡: duration_sec 是**每个阶段**的时长 (写一遍 + 读一遍),
    #    本项总耗时 = duration_sec × 2 = 60s。
    duration_sec: 30
    min_read_mbps: 80
    # **工作集大小**(MB) = 每次写多大的测试文件。同 TF 卡: 代码读这个键,
    # 配置文件里没声明 —— 调它的人翻遍 config.yaml 找不到。
    size_mb: 256

# 报告 (§8.2)
report:
  output_dir: "reports"     # PDF 落在 <此目录>/pdf/, 文件名 {SN}_{YYYYmmdd_HHMMSS}.pdf
  title: "工厂老化测试报告"
  # 测试人员姓名 / 批次号。
  #
  # ⚠️ operator 现在只是**默认值**, 不是唯一来源 —— 每一轮工人可以在配置页
  #    的「本轮测试人员」框里手填, 填的优先, 没填才回落到这里 (同一工位
  #    轮班换人时, 报告上得写当班的人)。
  # 留空字符串 = 报告里显示成「未填写」, **别留 None**, 那是 YAML 空值。
  # ⚠️ operator 填的是**测试人员的姓名**, 不是工号 —— 报告头那一行现在叫
  #    「测试人员」, 产线核对人靠的是名字, 工号是人事系统的编号, 纸面上没人认。
  #    配置键名**沿用 operator 没改**: 产线上已经装好的 config.yaml 里写的就是
  #    这个键, 改名的话老配置会被**静默忽略** —— 姓名那栏变空, 而且没人发现。
  # 测试人员同时会作为 operator 落进 DB, 供后续追溯; SN 是逐台从 /proc/cmdline
  # 读的 (§2.2), 不在这里配。
  operator: ""
  batch: ""

# 日志
logging:
  level: "INFO"             # DEBUG / INFO / WARNING / ERROR
  file: "logs/run.log"
